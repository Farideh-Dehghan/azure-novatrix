<!DOCTYPE html>
<html lang="sv">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Novatrix Kundtjänst</title>
  <style>
    * {
      box-sizing: border-box;
    }

    body {
      font-family: Arial, sans-serif;
      background: #f2f5f8;
      margin: 0;
      color: #1f2937;
    }

    header {
      background: #0078d4;
      color: white;
      padding: 30px;
      text-align: center;
    }

    main {
      max-width: 600px;
      margin: 40px auto;
      padding: 30px;
      background: white;
      border-radius: 10px;
      box-shadow: 0 4px 14px rgba(0, 0, 0, 0.1);
    }

    label {
      display: block;
      margin-top: 15px;
      font-weight: bold;
    }

    input,
    textarea {
      width: 100%;
      margin-top: 6px;
      padding: 10px;
      border: 1px solid #cbd5e1;
      border-radius: 5px;
      font: inherit;
    }

    textarea {
      min-height: 130px;
      resize: vertical;
    }

    button {
      margin-top: 20px;
      padding: 12px 20px;
      background: #0078d4;
      color: white;
      border: none;
      border-radius: 5px;
      cursor: pointer;
      font-size: 16px;
    }

    button:hover {
      background: #005fa3;
    }
  </style>
</head>
<body>
  <header>
    <h1>Novatrix AB</h1>
    <p>Välkommen till vår kundtjänst</p>
  </header>

  <main>
    <h2>Skicka ett ärende</h2>

    <form>
      <label for="name">Namn</label>
      <input type="text" id="name" name="name">

      <label for="email">E-post</label>
      <input type="email" id="email" name="email">

      <label for="message">Meddelande</label>
      <textarea id="message" name="message"></textarea>

      <button type="submit">Skicka ärende</button>
    </form>
  </main>
</body>
</html>
